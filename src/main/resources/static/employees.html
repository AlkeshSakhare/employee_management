<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>

<body>
<nav class="navbar">
    <div class="nav-brand">Employee Management</div>

    <div class="nav-links">
        <a href="/home.html">Home</a>
        <a href="/employees.html">Employees</a>
        <button onclick="logout()" class="logout-btn">
            Logout
        </button>
    </div>
</nav>


<div class="container">
    <div class="header">
        <div>
            <h1>Employee Management</h1>
            <p class="subtitle">Manage your employee records</p>
        </div>

        <button class="add-btn" onclick="openAddModal()">
            + Add Employee
        </button>
    </div>
    <div class="card">
        <h2>Employee List</h2>

        <!-- Employee Filters -->

        <div class="filter-section">

            <div class="filter-group">
                <label for="filterName">Employee Name</label>
                <input type="text" id="filterName"
                       placeholder="Search by name">
            </div>

            <div class="filter-group">
                <label for="filterDepartment">Department</label>
                <input type="text" id="filterDepartment"
                       placeholder="Search department">
            </div>

            <div class="filter-group">
                <label for="minSalary">Min Salary</label>
                <input type="number" id="minSalary"
                       placeholder="Minimum salary">
            </div>

            <div class="filter-group">
                <label for="maxSalary">Max Salary</label>
                <input type="number" id="maxSalary"
                       placeholder="Maximum salary">
            </div>

            <div class="filter-actions">
                <button class="filter-btn" onclick="applyFilters()">
                    Filter
                </button>

                <button class="reset-btn" onclick="resetFilters()">
                    Reset
                </button>
            </div>

        </div>
        <div id="message"></div>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="employeeTableBody">
            <tr>
                <td colspan="6" class="empty-message">
                    Loading employees...
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pagination">

            <button id="prevBtn" onclick="previousPage()">
                Previous
            </button>

            <span id="pageInfo">Page 1 of 1</span>

            <button id="nextBtn" onclick="nextPage()">
                Next
            </button>

        </div>
    </div>
</div>


<!-- Add/Edit Employee Modal -->

<div class="modal" id="employeeModal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Employee</h2>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department" required>
            </div>

            <div class="form-group">
                <label>Salary</label>
                <input type="number" id="salary"
                       min="0" step="any" required>
            </div>

            <div class="form-actions">

                <button type="button"
                        class="cancel-btn"
                        onclick="closeModal()">
                    Cancel
                </button>

                <button type="submit" class="save-btn">
                    Save
                </button>

            </div>

        </form>
    </div>
</div>
<script src="/js/script.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
